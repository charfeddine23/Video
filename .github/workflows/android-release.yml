name: Android Release Build & Publish

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, Auto-Version & Publish Release APK
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Auto-Increment Version & Compute APK Filename
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || echo "")
          LATEST_BODY=""
          if [ -n "$LATEST_TAG" ]; then
            LATEST_BODY=$(gh release view "$LATEST_TAG" --json body --jq '.body // ""' 2>/dev/null || echo "")
          fi
          export LATEST_TAG LATEST_BODY

          python3 - << 'PYEOF'
          import os
          import re
          import xml.etree.ElementTree as ET

          gradle_path = "app/build.gradle.kts"
          with open(gradle_path, "r", encoding="utf-8") as f:
              gradle_text = f.read()

          code_match = re.search(r'versionCode\s*=\s*(\d+)', gradle_text)
          name_match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle_text)

          gradle_code = int(code_match.group(1)) if code_match else 1
          gradle_name = name_match.group(1).strip() if name_match else "1.0.0"

          def parse_semver(ver: str):
              clean = ver.lstrip("vV").split("-")[0]
              nums = [int(x) for x in re.findall(r'\d+', clean)]
              while len(nums) < 3:
                  nums.append(0)
              return (max(1, nums[0]), nums[1], nums[2])

          latest_tag = os.environ.get("LATEST_TAG", "").strip()
          latest_body = os.environ.get("LATEST_BODY", "")

          remote_code = 0
          remote_tuple = (1, 0, 0)
          if latest_tag:
              remote_tuple = parse_semver(latest_tag)
              m_code = re.search(r'Version Code:\*\*\s*`?(\d+)`?', latest_body)
              if m_code:
                  remote_code = int(m_code.group(1))

          gradle_tuple = parse_semver(gradle_name)
          base_tuple = max(gradle_tuple, remote_tuple)
          new_code = max(gradle_code, remote_code) + 1
          new_name = f"{base_tuple[0]}.{base_tuple[1]}.{base_tuple[2] + 1}"

          updated_gradle = re.sub(
              r'(versionCode\s*=\s*)\d+',
              rf'\g<1>{new_code}',
              gradle_text,
              count=1,
          )
          updated_gradle = re.sub(
              r'(versionName\s*=\s*")[^"]+(")',
              rf'\g<1>{new_name}\g<2>',
              updated_gradle,
              count=1,
          )

          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(updated_gradle)

          app_name = "Video Pulse"
          strings_path = "app/src/main/res/values/strings.xml"
          if os.path.exists(strings_path):
              try:
                  tree = ET.parse(strings_path)
                  for elem in tree.getroot().findall("string"):
                      if elem.attrib.get("name") == "app_name" and elem.text:
                          app_name = elem.text.strip()
                          break
              except Exception:
                  pass

          safe_app_name = re.sub(r'\s+', '.', app_name)
          safe_app_name = re.sub(r'[^A-Za-z0-9._-]', '', safe_app_name) or "Video.Pulse"
          apk_filename = f"{safe_app_name}.v{new_name}.apk"
          release_tag = f"v{new_name}"

          github_env = os.environ["GITHUB_ENV"]
          with open(github_env, "a", encoding="utf-8") as env_file:
              env_file.write(f"VERSION_CODE={new_code}\n")
              env_file.write(f"VERSION_NAME={new_name}\n")
              env_file.write(f"RELEASE_TAG={release_tag}\n")
              env_file.write(f"APK_FILENAME={apk_filename}\n")

          print(f"Auto-incremented version: v{new_name} (versionCode={new_code})")
          print(f"Target APK filename: {apk_filename}")
          PYEOF

      - name: Configure Keystore for Consistent Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding persistent release keystore from GitHub Secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          elif [ -f "$KEYSTORE_FILE" ]; then
            echo "Using repository persistent release keystore (my-upload-key.jks) to preserve upgrade compatibility."
          else
            echo "::error::Missing my-upload-key.jks and KEYSTORE_BASE64 secret. Refusing to generate a mismatched key that would break in-place app updates."
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${STORE_PASS:-android}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KEY_PASS:-android}" >> $GITHUB_ENV

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Signature & Rename APK
        run: |
          APK_DIR="app/build/outputs/apk/release"
          SOURCE_APK="$APK_DIR/app-release.apk"

          if [ ! -f "$SOURCE_APK" ]; then
            echo "::error::Signed release APK not found at $SOURCE_APK"
            ls -la "$APK_DIR" || true
            exit 1
          fi

          FINAL_APK="$APK_DIR/${{ env.APK_FILENAME }}"
          cp "$SOURCE_APK" "$FINAL_APK"

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "Verifying APK signing certificate for in-place upgrade compatibility..."
            "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$FINAL_APK"
          fi
          if [ -n "$BUILD_TOOLS_DIR" ] && [ -x "$BUILD_TOOLS_DIR/aapt2" ]; then
            "$BUILD_TOOLS_DIR/aapt2" dump badging "$FINAL_APK" | head -n 5
          fi

          echo "FINAL_APK_PATH=$FINAL_APK" >> $GITHUB_ENV
          echo "Prepared signed release APK: $FINAL_APK"

      - name: Commit Incremented Version to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet app/build.gradle.kts; then
            git add app/build.gradle.kts
            git commit -m "chore: bump version to ${{ env.RELEASE_TAG }} (build ${{ env.VERSION_CODE }}) [skip ci]"
            if ! git pull --rebase origin "${{ github.ref_name }}"; then
              git rebase --abort || true
            fi
            git push origin "HEAD:${{ github.ref_name }}" || echo "::warning::Could not push version bump commit (check branch protection)."
          fi

      - name: Publish Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.ref_name }}
          name: "Video Pulse ${{ env.RELEASE_TAG }} (Build ${{ env.VERSION_CODE }})"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.FINAL_APK_PATH }}
          body: |
            ## Video Pulse — ${{ env.RELEASE_TAG }} (Build ${{ env.VERSION_CODE }})

            ### Build & Release Details
            - **APK File:** `${{ env.APK_FILENAME }}`
            - **Application ID:** `com.aistudio.videopulse.vstrm`
            - **Version Name:** `${{ env.VERSION_NAME }}`
            - **Version Code:** `${{ env.VERSION_CODE }}`
            - **Git Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`

            ### Direct Update Compatibility
            - Signed with the persistent release keystore (`upload` alias) and strictly incremented `versionCode`.
            - Installs directly over any previous version without uninstalling or losing app data.

      - name: Delete Old Releases & Stale Tags (Keep Only Latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while IFS= read -r old_tag; do
            if [ -n "$old_tag" ] && [ "$old_tag" != "${{ env.RELEASE_TAG }}" ]; then
              echo "Deleting old release and tag: $old_tag"
              gh release delete "$old_tag" --yes --cleanup-tag || true
            fi
          done

          git fetch --tags --prune
          git tag -l 'v*' | while IFS= read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "${{ env.RELEASE_TAG }}" ]; then
              echo "Deleting stale tag: $tag"
              git push origin --delete "$tag" 2>/dev/null || true
            fi
          done

      - name: Clean Up Previous Actions Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${{ github.run_id }} and .status == \"completed\") | .id" \
            | while IFS= read -r run_id; do
                if [ -n "$run_id" ]; then
                  echo "Deleting old workflow run: $run_id"
                  gh api -X DELETE "repos/${{ github.repository }}/actions/runs/${run_id}" || true
                fi
              done
